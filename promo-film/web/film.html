<!doctype html>
<html lang="ar"><head><meta charset="utf-8">
<title>PhysioLearn Film</title>
<link rel="stylesheet" href="appfonts.css">
<style>
@font-face{font-family:Alex;font-weight:300;src:url(alexandria-arabic-300-normal.woff2)}
@font-face{font-family:Alex;font-weight:500;src:url(alexandria-arabic-500-normal.woff2)}
@font-face{font-family:Alex;font-weight:800;src:url(alexandria-arabic-800-normal.woff2)}
@font-face{font-family:Alex;font-weight:900;src:url(alexandria-arabic-900-normal.woff2)}
@font-face{font-family:AlexL;font-weight:300;src:url(alexandria-latin-300-normal.woff2)}
@font-face{font-family:AlexL;font-weight:500;src:url(alexandria-latin-500-normal.woff2)}
@font-face{font-family:AlexL;font-weight:800;src:url(alexandria-latin-800-normal.woff2)}
@font-face{font-family:AlexL;font-weight:900;src:url(alexandria-latin-900-normal.woff2)}
@font-face{font-family:Naskh;font-weight:700;src:url(noto-naskh-arabic-arabic-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:400;src:url(inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(inter-latin-700-normal.woff2)}
:root{--navy:#12303B;--teal:#0F7F7A;--cyan:#19AFC0;--ice:#E6F4F6;--paper:#F8FBFC;--amber:#E1A23A;--coral:#E0634F;--grey:#6B8590}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;perspective:2600px;font-family:Alex,AlexL,sans-serif;color:var(--navy)}
#bg{position:absolute;inset:0;background:radial-gradient(1200px 900px at 80% 8%,#E3F3F5 0%,rgba(227,243,245,0) 60%),radial-gradient(1000px 900px at 10% 92%,#E7F0FA 0%,rgba(231,240,250,0) 60%),linear-gradient(180deg,#FBFDFD,#F2F8F9)}
#dots{position:absolute;inset:0;opacity:.55}
.d{position:absolute;left:0;top:0;opacity:0;will-change:transform,opacity}
.c{transform-origin:center}
/* text */
.line{white-space:nowrap;direction:rtl;text-align:center}
.w{display:inline-block;vertical-align:bottom;padding:0 .04em .34em;margin-bottom:-.22em;clip-path:inset(-60% -40% 0 -40%)}
.w>i{display:inline-block;font-style:normal;will-change:transform}
.tag{font:500 30px Alex;color:var(--teal);background:#fff;border:2px solid #CFE6E8;border-radius:999px;padding:12px 30px;direction:rtl;box-shadow:0 8px 30px rgba(15,127,122,.08)}
.tag b{font-weight:800;color:var(--navy);margin-left:12px}
/* phones */
.phone{width:418px;height:872px;transform-style:preserve-3d}
.phone .body{position:absolute;inset:0;border-radius:66px;background:linear-gradient(145deg,#2A3C44,#0E1B21 55%,#24363E);box-shadow:0 60px 120px rgba(18,48,59,.28),0 20px 40px rgba(18,48,59,.18),inset 0 0 0 2px rgba(255,255,255,.18)}
.phone .screen{position:absolute;left:14px;top:14px;width:390px;height:844px;border-radius:53px;overflow:hidden;background:#F5F7F7}
.phone.and .body{border-radius:44px;background:linear-gradient(145deg,#3A4A52,#1A2429 60%,#33434B)}
.phone.and .screen{border-radius:34px}
.island{position:absolute;left:50%;top:25px;width:122px;height:36px;margin-left:-61px;background:#000;border-radius:20px;z-index:30}
.punch{position:absolute;left:50%;top:26px;width:20px;height:20px;margin-left:-10px;background:#000;border-radius:50%;z-index:30}
.glare{position:absolute;left:14px;top:14px;width:390px;height:844px;border-radius:53px;background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 70%,rgba(255,255,255,.08) 100%);pointer-events:none;z-index:40}
.L{position:absolute;inset:0;opacity:0;overflow:hidden;will-change:transform,opacity}
.L img.app{position:absolute;left:0;top:47px;width:390px}
.and .L img.app{top:32px}
.sb{position:absolute;left:0;top:0;width:390px;height:47px;z-index:25;font:600 16px Inter;color:#000;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 46px}
.sb .ic{display:flex;gap:6px;align-items:center}
.and .sb{height:32px;padding:4px 22px 0 24px;font:500 13px Inter}
.ripple{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid rgba(25,175,192,.9);background:rgba(25,175,192,.18);z-index:60;opacity:0}
.hl{position:absolute;border:3px solid var(--cyan);border-radius:14px;box-shadow:0 0 0 6px rgba(25,175,192,.18);z-index:55;opacity:0}
.finger{position:absolute;left:0;top:0;width:150px;height:190px;z-index:70;opacity:0;pointer-events:none;filter:drop-shadow(0 18px 18px rgba(18,48,59,.28))}
/* ios ui */
.ios{font-family:Inter,system-ui;color:#000}
.wall{position:absolute;inset:0;background:radial-gradient(500px 500px at 20% 10%,#BFE6EA,rgba(191,230,234,0) 60%),radial-gradient(500px 600px at 90% 90%,#C9D8F3,rgba(201,216,243,0) 60%),linear-gradient(160deg,#DCEFF2,#E9EEF8)}
.grid{position:absolute;left:24px;right:24px;top:78px;display:grid;grid-template-columns:repeat(4,1fr);row-gap:22px;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px}
.app .i{width:62px;height:62px;border-radius:15px;box-shadow:0 2px 6px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center}
.app span{font:500 11.5px Inter;color:#123;text-align:center;white-space:nowrap}
.and .app span{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.dock{position:absolute;left:14px;right:14px;bottom:14px;height:92px;border-radius:34px;background:rgba(255,255,255,.45);backdrop-filter:blur(10px);display:flex;justify-content:space-around;align-items:center}
.pl-ic{width:62px;height:62px;border-radius:15px;background:#0F7F7A;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.15)}
.pl-ic i{display:block;width:25px;height:25px;border:4.5px solid #fff;border-radius:50% 50% 50% 6px}
.sbar{position:absolute;left:12px;right:12px;bottom:26px;height:58px;display:flex;gap:10px;align-items:center;z-index:20}
.glass{background:rgba(250,250,252,.82);backdrop-filter:blur(14px);box-shadow:0 6px 20px rgba(0,0,0,.14),inset 0 0 0 .5px rgba(0,0,0,.08)}
.sbar .b{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.sbar .addr{flex:1;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:6px;font:500 15px Inter;color:#111}
.menu{position:absolute;right:14px;bottom:96px;width:250px;border-radius:26px;padding:8px 0;z-index:30}
.menu .it{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font:400 16.5px Inter}
.menu .sep{height:6px;background:rgba(0,0,0,.05)}
.sheet{position:absolute;left:0;right:0;bottom:0;height:610px;border-radius:30px 30px 0 0;background:#F2F2F7;z-index:35;box-shadow:0 -10px 40px rgba(0,0,0,.15);overflow:hidden}
.sheet .hd{display:flex;align-items:center;gap:12px;padding:20px 20px 14px}
.sheet .row{display:flex;gap:16px;padding:6px 20px 14px;overflow:hidden}
.sheet .row .a{display:flex;flex-direction:column;align-items:center;gap:6px;font:400 11px Inter;color:#333;width:62px}
.sheet .row .a i{width:58px;height:58px;border-radius:14px;display:block}
.grp{margin:8px 16px;background:#fff;border-radius:14px;overflow:hidden}
.grp .it{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font:400 16.5px Inter;border-bottom:.5px solid #E2E2E7}
.grp .it:last-child{border-bottom:none}
.addhs{position:absolute;inset:0;background:#F2F2F7;z-index:36}
.addhs .nav{height:54px;margin-top:47px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font:400 17px Inter}
.addhs .nav b{font-weight:600}
.blue{color:#0A7AFF}
.tog{width:51px;height:31px;border-radius:16px;background:#34C759;position:relative}
.tog:after{content:"";position:absolute;right:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
/* android */
.abar{position:absolute;left:0;right:0;top:32px;height:64px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;z-index:20;box-shadow:0 1px 0 rgba(0,0,0,.06);font-family:Roboto,Inter}
.abar .url{flex:1;height:44px;border-radius:22px;background:#EEF1F4;display:flex;align-items:center;gap:8px;padding:0 14px;font:400 15px Inter;color:#202124;overflow:hidden;white-space:nowrap}
.abar .tabs{width:22px;height:22px;border:2px solid #444;border-radius:5px;font:600 11px Inter;display:flex;align-items:center;justify-content:center;color:#333}
.amenu{position:absolute;right:8px;top:40px;width:256px;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.22);padding:6px 0;z-index:30;font-family:Inter}
.amenu .ico{display:flex;justify-content:space-around;height:50px;align-items:center;border-bottom:1px solid #eee}
.amenu .it{height:44px;display:flex;align-items:center;padding:0 18px;font:400 15.5px Inter;color:#202124}
.dlg{position:absolute;left:28px;right:28px;top:300px;background:#fff;border-radius:28px;padding:24px;z-index:40;box-shadow:0 20px 60px rgba(0,0,0,.3);font-family:Inter}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:38}
.andwall{position:absolute;inset:0;background:linear-gradient(170deg,#2E6F78 0%,#4C8FA0 40%,#9CC3D0 100%)}
.gbar{position:absolute;left:24px;right:24px;bottom:110px;height:56px;border-radius:28px;background:rgba(255,255,255,.9);display:flex;align-items:center;padding:0 20px;font:400 15px Inter;color:#666}
.navh{position:absolute;left:50%;bottom:10px;width:120px;margin-left:-60px;height:5px;border-radius:3px;background:rgba(0,0,0,.5);z-index:50}
/* line art */
svg.la{overflow:visible}
svg.la *{vector-effect:non-scaling-stroke}
.card{background:#fff;border-radius:26px;box-shadow:0 20px 50px rgba(18,48,59,.12),0 0 0 1px rgba(18,48,59,.05);direction:rtl}
.lbl{font:800 40px Alex;color:var(--navy);direction:rtl;white-space:nowrap}
.step{display:flex;align-items:center;gap:18px;direction:rtl;background:#fff;border-radius:22px;padding:16px 26px;box-shadow:0 14px 36px rgba(18,48,59,.10);font:500 34px Alex;color:var(--navy);white-space:nowrap}
.step b{width:56px;height:56px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font:800 30px Alex}
#sig{font:500 26px Inter;color:var(--navy);background:rgba(255,255,255,.85);border:1.5px solid #D5E7EA;border-radius:999px;padding:10px 22px;display:flex;align-items:center;gap:10px}
#sig i{width:12px;height:12px;border-radius:50%;background:var(--teal);display:block}
</style></head>
<body><div id="stage">
<div id="bg"></div><canvas id="dots" width="1080" height="1920"></canvas>
<div id="root"></div>
</div>
<script src="film.js"></script>
</body></html>
